version: 2

# Ephemeral models cannot be tested directly -- there is no table to query.
# They are still documented, and they still appear in `dbt docs` as nodes of
# the DAG, which is what makes the lineage readable.

models:
  - name: int_order_lines_enriched
    description: >
      Order lines joined to their header, with gross / discount / net revenue
      computed once. Grain: order_id + product_id. Ephemeral -- consumed by
      fct_order_line and fct_orders.
    columns:
      - name: gross_amount
        description: unit_price * quantity, before discount.
      - name: discount_amount
        description: unit_price * quantity * discount_pct.
      - name: net_amount
        description: unit_price * quantity * (1 - discount_pct). The revenue number.

  - name: int_products_categorized
    description: >
      Products flattened with their category and supplier attributes.
      Grain: product_id. Ephemeral -- consumed by dim_product.
