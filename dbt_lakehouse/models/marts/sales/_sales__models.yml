version: 2

# Marts is where the strict tests live. Two categories matter most:
#   * `unique` on the key at the declared grain -- proves the grain is real
#     and did not silently fan out through a join;
#   * `relationships` from every fact FK to its dimension -- proves the star
#     schema actually joins. In practice this is the test that catches the
#     most real bugs, because a broken FK produces silently missing rows in a
#     dashboard rather than an error.
#
# Note the relationships tests ignore nulls by design, which is what makes
# shipped_date_key (null for orders that never shipped) test cleanly.

models:
  - name: dim_date
    description: >
      Generated calendar covering 1996-01-01 to 1999-12-31. Grain: one row per
      day. Not sourced from any table.
    columns:
      - name: date_key
        description: yyyyMMdd as an integer. The one dimension that does not use a hashed key.
        tests: [unique, not_null]
      - name: date_day
        tests: [unique, not_null]
      - name: is_weekend
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: dim_customer
    description: "One row per customer. Grain: customer_key."
    columns:
      - name: customer_key
        description: Surrogate key, md5 of customer_id.
        tests: [unique, not_null]
      - name: customer_id
        description: Natural key from the source system.
        tests: [unique, not_null]
      - name: customer_name
        tests: [not_null]

  - name: dim_product
    description: "One row per product, with category and supplier denormalised in. Grain: product_key."
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: product_id
        tests: [unique, not_null]
      - name: product_name
        tests: [not_null]
      - name: category_name
        tests: [not_null]

  - name: dim_employee
    description: "One row per employee, with the manager resolved from the reportsTo hierarchy. Grain: employee_key."
    columns:
      - name: employee_key
        tests: [unique, not_null]
      - name: employee_id
        tests: [unique, not_null]
      - name: manager_name
        description: Null for the top of the hierarchy.

  - name: dim_shipper
    description: "One row per shipping company. Grain: shipper_key."
    columns:
      - name: shipper_key
        tests: [unique, not_null]
      - name: shipper_id
        tests: [unique, not_null]

  - name: fct_order_line
    description: >
      GRAIN: one row per product on an order. The revenue fact -- use this for
      anything sliced by product or category. Does NOT carry freight, which is
      charged per order and would be double-counted at this grain.
    columns:
      - name: order_line_key
        description: Surrogate key at the grain, md5 of (order_id, product_id).
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: employee_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_employee')
              field: employee_key
      - name: shipper_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_shipper')
              field: shipper_key
      - name: order_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: shipped_date_key
        description: Null for orders that have not shipped.
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: quantity
        tests: [not_null]
      - name: net_amount
        description: Additive. unit_price * quantity * (1 - discount_pct).
        tests: [not_null]
      - name: discount_pct
        description: NON-ADDITIVE. A rate -- filter and group by it, never SUM it.

  - name: fct_orders
    description: >
      GRAIN: one row per order. The fulfilment fact -- use this for freight,
      shipping punctuality and order counts. Rolls up the same revenue measures
      as fct_order_line; the two are reconciled by a singular test.
    columns:
      - name: order_key
        tests: [unique, not_null]
      - name: order_id
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: employee_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_employee')
              field: employee_key
      - name: shipper_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_shipper')
              field: shipper_key
      - name: order_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: shipped_date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: line_count
        tests: [not_null]
      - name: freight_amount
        description: Additive at the order grain only. Deliberately absent from fct_order_line.
        tests: [not_null]
      - name: is_shipped_on_time
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
