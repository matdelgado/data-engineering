version: 2

sources:
  - name: northwind
    description: >
      Raw Northwind tables, landed in the bronze layer as Delta by
      `spark/ingest_northwind.py` and registered in the Thrift server's catalog.
      Every column is a string here on purpose: bronze is a faithful copy of the
      source, and casting is the staging layer's job.

      Note that bronze is declared as a *source*, not built as a dbt model. dbt
      does not do ingestion -- it starts where the data has already landed. A
      `raw_*` model that only did `select * from bronze` would be a second copy
      of the same bytes and would teach nothing.
    schema: bronze
    # Tagged so that `--exclude tag:northwind` also excludes the tests defined
    # here. Model tags come from dbt_project.yml, but sources are not models --
    # without this line the sample pipeline's `dbt test` would still run these
    # 14 source tests and fail on anyone who has not run `northwind_ingest`.
    tags: ['northwind', 'bronze']
    tables:
      - name: categories
        identifier: northwind_categories
        description: Product categories. The `picture` column is an MS Access blob.
        columns:
          - name: categoryID
            tests: [unique, not_null]

      - name: customers
        identifier: northwind_customers
        description: Companies that place orders. The key is a 5-letter code, not a number.
        columns:
          - name: customerID
            tests: [unique, not_null]

      - name: employees
        identifier: northwind_employees
        description: Sales representatives. `reportsTo` makes this a self-referencing hierarchy.
        columns:
          - name: employeeID
            tests: [unique, not_null]

      - name: order_details
        identifier: northwind_order_details
        description: One row per product on an order. Composite key (orderID, productID).

      - name: orders
        identifier: northwind_orders
        description: Order headers, 1996-07 to 1998-05.
        columns:
          - name: orderID
            tests: [unique, not_null]

      - name: products
        identifier: northwind_products
        columns:
          - name: productID
            tests: [unique, not_null]

      - name: shippers
        identifier: northwind_shippers
        columns:
          - name: shipperID
            tests: [unique, not_null]

      - name: suppliers
        identifier: northwind_suppliers
        columns:
          - name: supplierID
            tests: [unique, not_null]
