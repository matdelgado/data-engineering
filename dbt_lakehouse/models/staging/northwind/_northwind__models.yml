version: 2

# Tests get stricter as you move up the layers. In staging the question is
# only "did the source arrive intact?" -- primary keys and enumerations.
# Referential integrity is checked in the marts, where the star schema
# actually depends on it.

models:
  - name: stg_northwind__orders
    description: "One row per order header. Grain: order_id."
    columns:
      - name: order_id
        description: Natural key of the order.
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: employee_id
        tests: [not_null]
      - name: ordered_at
        tests: [not_null]
      - name: shipped_at
        description: Null while the order has not shipped yet.
      - name: freight_amount
        tests: [not_null]

  - name: stg_northwind__order_details
    description: "One row per product on an order. Grain: order_id + product_id."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, product_id]
    columns:
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: discount_pct
        description: Line discount as a fraction, 0.00 to 1.00.
        tests: [not_null]

  - name: stg_northwind__products
    description: "One row per product. Grain: product_id."
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: product_name
        tests: [not_null]
      - name: category_id
        tests: [not_null]
      - name: supplier_id
        tests: [not_null]
      - name: is_discontinued
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: stg_northwind__categories
    description: "One row per product category. Grain: category_id."
    columns:
      - name: category_id
        tests: [unique, not_null]
      - name: category_name
        tests: [unique, not_null]

  - name: stg_northwind__suppliers
    description: "One row per supplier. Grain: supplier_id."
    columns:
      - name: supplier_id
        tests: [unique, not_null]
      - name: supplier_name
        tests: [not_null]

  - name: stg_northwind__customers
    description: "One row per customer company. Grain: customer_id."
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_name
        tests: [not_null]
      - name: customer_country
        tests: [not_null]

  - name: stg_northwind__employees
    description: "One row per employee. Grain: employee_id."
    columns:
      - name: employee_id
        tests: [unique, not_null]
      - name: employee_name
        tests: [not_null]
      - name: manager_employee_id
        description: Null for the top of the hierarchy.
        tests:
          - relationships:
              to: ref('stg_northwind__employees')
              field: employee_id

  - name: stg_northwind__shippers
    description: "One row per shipping company. Grain: shipper_id."
    columns:
      - name: shipper_id
        tests: [unique, not_null]
      - name: shipper_name
        tests: [not_null]
