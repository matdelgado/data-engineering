
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_lakehouse'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_lakehouse'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
# Where each medallion layer physically lives. This is the ONLY place a bucket
# is named: the `spark__create_schema` override in macros/ attaches the
# location to the schema itself, and every table created in that schema then
# inherits the right bucket automatically -- whether it was created by dbt,
# by a Spark job or by hand in beeline.
#
# The alternative, setting `+location_root` per model directory, only redirects
# the tables dbt itself creates. The schema stays registered under
# spark.sql.warehouse.dir (s3a://gold/warehouse), so `DESCRIBE DATABASE silver`
# reports the gold bucket and anything created outside dbt silently lands
# there. One mapping beats one setting per folder.
vars:
  layer_locations:
    bronze: s3a://bronze/warehouse
    silver: s3a://silver/warehouse
    mart_sales: s3a://gold/warehouse

# Configuration lives here, per directory, and models only override the
# exception. `+schema` is now the single knob: it picks the layer, and the
# bucket follows from `layer_locations` above.
models:
  dbt_lakehouse:
    example:
      +materialized: table
      +schema: "{{ 'staging' }}"
      +file_format: delta

    marts:
      +materialized: table
      +schema: "{{ 'marts' }}"
      +file_format: delta

      # Gold, sales domain. One schema per business domain, so a future
      # mart_finance can live next to it without colliding.
      sales:
        +schema: "{{ 'mart_sales' }}"
        +tags: ['northwind', 'gold']

    staging:
      +materialized: table
      +schema: "{{ 'staging' }}"
      +file_format: delta

      # Silver. Materialised as tables rather than the dbt default of views:
      # in a lakehouse the silver layer has to be physically readable by
      # Trino/Superset/Spark, and a view here would re-read the bronze Delta
      # on every single query.
      northwind:
        +schema: "{{ 'silver' }}"
        +tags: ['northwind', 'silver']

    intermediate:
      +materialized: table
      +schema: "{{ 'intermediate' }}"
      +file_format: delta

      # Still silver, but ephemeral: these compile into CTEs of the models
      # that reference them and never reach the metastore. That is what stops
      # the BI tool from accidentally consuming half-finished business logic.
      northwind:
        +materialized: ephemeral
        +tags: ['northwind', 'silver']
